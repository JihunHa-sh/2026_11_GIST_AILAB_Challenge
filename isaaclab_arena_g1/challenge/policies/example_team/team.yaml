# Starting point: copy this folder to policies/<your team>/ and point the classes at your own files.
team_name: example_team
high_level:
  class: isaaclab_arena_g1.challenge.policies.example_team.high_level.MyHighLevel
  options: {}          # passed to MyHighLevel, e.g. {max_forward_vel: 0.5}
low_level:
  class: default   # or isaaclab_arena_g1.challenge.policies.example_team.low_level.MyLowLevel
  options: {}
